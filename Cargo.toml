[package]
name = "axum-web"
version = "0.1.12"
edition = "2024"
authors = ["Sheroz Khaydarov"]
description = "A sample starter project for building REST API Web service in Rust using actix-web, JWT, SQLx, PostgreSQL, and Redis"
readme = "README.md"
repository = "https://github.com/sheroz/axum-web"
license = "MIT"
rust-version = "1.96"

[dependencies]
dotenvy = "0.15"
actix-web = { version = "4.11" }
tokio = { version = "1.50", features = ["full"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# axum's `Json` extractor deserializes through `serde_path_to_error`, so a
# type mismatch names the offending field: `username: invalid type: ...`.
# actix's does not, and the port lost the path on every rejection.
serde_path_to_error = "0.1"
futures-util = "0.3"
uuid = { version = "1.22", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

redis = { version = "1.1", features = ["tokio-comp"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "macros",
    "chrono",
] }

jsonwebtoken = {version = "10", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
serial_test = "3.4"
reqwest = { version = "0.13", features = ["json"] }
